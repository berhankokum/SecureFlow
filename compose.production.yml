# Standalone; never merge this with docker-compose.yml or reuse development volumes.
name: secureflow-production
services:
  edge:
    image: secureflow-edge:phase27
    build:
      context: .
      dockerfile: infra/production/Frontend.Dockerfile
    environment:
      SERVER_NAME: ${PRODUCTION_HOST:?Set the public hostname}
      HTTPS_PORT: ${PRODUCTION_HTTPS_PORT:-443}
    ports:
      - "${PRODUCTION_BIND_ADDRESS:-127.0.0.1}:${PRODUCTION_HTTP_PORT:-80}:8080"
      - "${PRODUCTION_BIND_ADDRESS:-127.0.0.1}:${PRODUCTION_HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${PRODUCTION_SECRETS_DIR:?Set an absolute secrets directory}/fullchain.pem
        target: /run/tls/fullchain.pem
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${PRODUCTION_SECRETS_DIR}/privatekey.pem
        target: /run/tls/privatekey.pem
        read_only: true
        bind: { create_host_path: false }
    networks:
      proxy:
        ipv4_address: ${PRODUCTION_PROXY_IP:-172.30.27.2}
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  api:
    image: secureflow-api:phase27
    build:
      context: .
      dockerfile: infra/production/Api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${PRODUCTION_HOST}
    volumes:
      - keys:/var/lib/secureflow/keys
      - type: bind
        source: ${PRODUCTION_SECRETS_DIR}/settings.json
        target: /run/secureflow/settings.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${PRODUCTION_SECRETS_DIR}/protection.pfx
        target: /run/secureflow/protection.pfx
        read_only: true
        bind: { create_host_path: false }
    networks:
      proxy:
        ipv4_address: ${PRODUCTION_API_IP:-172.30.27.3}
      data: {}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      object-storage: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  postgres:
    image: secureflow-postgres:17-patched-20260919
    build: { context: ./infra/postgres }
    environment:
      POSTGRES_DB: secureflow
      POSTGRES_USER: secureflow_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U secureflow_admin -d secureflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    # No password on the command line/process arguments; mount a protected config.
    command: [redis-server, /run/secrets/redis.conf]
    secrets: [redis.conf]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping 2>&1 | grep -q NOAUTH"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  object-storage:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/s3-access-key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/s3-secret-key
      RUSTFS_CONSOLE_ENABLE: "false"
    secrets: [s3-access-key, s3-secret-key]
    volumes: ["object-data:/data"]
    networks: [data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/health]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
secrets:
  postgres-password:
    file: ${PRODUCTION_SECRETS_DIR}/postgres-password
  redis.conf:
    file: ${PRODUCTION_SECRETS_DIR}/redis.conf
  s3-access-key:
    file: ${PRODUCTION_SECRETS_DIR}/s3-access-key
  s3-secret-key:
    file: ${PRODUCTION_SECRETS_DIR}/s3-secret-key
networks:
  proxy:
    ipam:
      config:
        - subnet: ${PRODUCTION_PROXY_SUBNET:-172.30.27.0/29}
  data:
    internal: true
volumes:
  keys:
  postgres-data:
  object-data:
