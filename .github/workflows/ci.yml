name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Aşağıdaki Postgres kimlik bilgileri, yalnızca bu job'ın ömrü boyunca var olan
    # tek kullanımlık bir CI service container'ı içindir; gerçek bir secret değildir
    # ve GitHub Actions secrets/vars mekanizması gerektirmez.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: secureflow
          POSTGRES_USER: secureflow
          POSTGRES_PASSWORD: secureflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secureflow -d secureflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=secureflow;Username=secureflow;Password=secureflow"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SecureFlow.slnx

      - name: Build
        run: dotnet build SecureFlow.slnx --no-restore --configuration Release

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/SecureFlow.Api/SecureFlow.Api.csproj
          --startup-project src/SecureFlow.Api/SecureFlow.Api.csproj

      - name: Test
        run: dotnet test SecureFlow.slnx --no-build --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
